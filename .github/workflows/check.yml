name: check-mod
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod

      - name: Unit tests for the mod logic
        run: cargo test
        working-directory: mod

      - name: Get Horizon's mod tools
        run: |
          sudo apt-get install -y rsync pkg-config libasound2-dev libudev-dev
          git clone --depth 1 https://github.com/horizon-rust/horizon-mods

      - name: Use the same Horizon revision as the official mods
        run: |
          cat horizon-mods/native/fps-overlay/compatibility.json
          cp horizon-mods/native/fps-overlay/compatibility.json mod/compatibility.json
          REV=$(python3 -c "import json;print(json.load(open('mod/compatibility.json'))['horizon_revision'])")
          sed -i "s/^horizon_revision = .*/horizon_revision = \"$REV\"/" mod/mixins/horizon-essentials/horizon-mixin.toml

      - name: Compile the mod against Horizon (slow, several minutes)
        run: python3 horizon-mods/native/tools/native.py check "$GITHUB_WORKSPACE/mod"

      - name: Package the .hnmod
        run: python3 horizon-mods/native/tools/native.py package "$GITHUB_WORKSPACE/mod"

      - name: Upload the .hnmod
        uses: actions/upload-artifact@v4
        with:
          name: horizon-essentials-hnmod
          path: horizon-mods/native/target/*.hnmod
