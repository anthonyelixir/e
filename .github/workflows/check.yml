name: check-mod
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod

      - name: Unit tests for the mod logic
        run: cargo test
        working-directory: mod

      - name: Get Horizon's mod tools
        run: |
          sudo apt-get install -y rsync
          git clone --depth 1 https://github.com/horizon-rust/horizon-mods

      - name: Compile the mod against Horizon (slow, several minutes)
        run: python3 horizon-mods/native/tools/native.py check mod
